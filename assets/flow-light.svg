<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
<title id="t">Aegis request flow</title>
<desc id="d">A caller sends a request to the Aegis gateway, which admits it, forwards it to the upstream LLM provider, then redacts, hashes, signs and commits the record to the ledger, and returns the response with proof headers. For non-streaming responses the commit happens before the response is returned.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#6F8E98"/></marker></defs>
<rect width="900" height="300" fill="#FFFFFF"/>
<g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle"><rect x="20" y="40" width="180" height="90" rx="10" fill="#EAF3F5" stroke="#14505F" stroke-width="2"/><text x="110.0" y="80" font-size="22" font-weight="700" fill="#0F1B20">Caller</text><text x="110.0" y="106" font-size="15" fill="#41525B">application</text><rect x="270" y="40" width="240" height="90" rx="10" fill="#EAF3F5" stroke="#14505F" stroke-width="2"/><text x="390.0" y="80" font-size="22" font-weight="700" fill="#0F1B20">Aegis gateway</text><text x="390.0" y="106" font-size="15" fill="#41525B">admit, forward, record</text><rect x="620" y="40" width="180" height="90" rx="10" fill="#EAF3F5" stroke="#14505F" stroke-width="2"/><text x="710" y="80" font-size="22" font-weight="700" fill="#0F1B20">Upstream</text><text x="710" y="106" font-size="15" fill="#41525B">LLM provider</text><g stroke="#6F8E98" stroke-width="2.5" marker-end="url(#a)"><line x1="200" y1="70" x2="266" y2="70"/><line x1="512" y1="70" x2="616" y2="70"/><line x1="616" y1="108" x2="516" y2="108"/><line x1="266" y1="108" x2="204" y2="108"/></g>
<text x="233" y="60" font-size="13" fill="#41525B">request</text><text x="564" y="60" font-size="13" fill="#41525B">forward</text><text x="564" y="130" font-size="13" fill="#41525B">response</text><text x="235" y="130" font-size="13" fill="#41525B">response</text>
<text x="390" y="165" font-size="15" fill="#41525B">then, inside the gateway:</text>
<rect x="30" y="185" width="100" height="46" rx="8" fill="#EAF3F5" stroke="#14505F" stroke-width="1.5"/><text x="80.0" y="214" font-size="16" fill="#0F1B20">redact</text><line x1="132" y1="208" x2="150" y2="208" stroke="#6F8E98" stroke-width="2.5" marker-end="url(#a)"/><rect x="154" y="185" width="90" height="46" rx="8" fill="#EAF3F5" stroke="#14505F" stroke-width="1.5"/><text x="199.0" y="214" font-size="16" fill="#0F1B20">hash</text><line x1="246" y1="208" x2="264" y2="208" stroke="#6F8E98" stroke-width="2.5" marker-end="url(#a)"/><rect x="268" y="185" width="90" height="46" rx="8" fill="#EAF3F5" stroke="#14505F" stroke-width="1.5"/><text x="313.0" y="214" font-size="16" fill="#0F1B20">sign</text><line x1="360" y1="208" x2="378" y2="208" stroke="#6F8E98" stroke-width="2.5" marker-end="url(#a)"/><rect x="382" y="185" width="200" height="46" rx="8" fill="#EAF3F5" stroke="#14505F" stroke-width="1.5"/><text x="482.0" y="214" font-size="16" fill="#0F1B20">WAL append + fsync</text><line x1="584" y1="208" x2="602" y2="208" stroke="#6F8E98" stroke-width="2.5" marker-end="url(#a)"/><rect x="606" y="185" width="120" height="46" rx="8" fill="#EAF3F5" stroke="#14505F" stroke-width="1.5"/><text x="666.0" y="214" font-size="16" fill="#0F1B20">MMR leaf</text><text x="450" y="268" font-size="15" fill="#41525B">Caller receives the response plus X-Aegis-Evidence-Status and MMR proof headers.</text></g></svg>